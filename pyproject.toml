[project]
name = "pep-backend-python"
version = "0.1.0"
description = "Prontuário Eletrônico do Paciente — Clínica-Escola de Psicologia (backend FastAPI, migrado do Fastify)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "pyodbc>=5.2",
  "alembic>=1.14",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "cryptography>=43.0",
  "httpx>=0.28",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI usa Depends(...) como valor-padrão de parâmetro de propósito
# (é o mecanismo de injeção de dependência da framework) — não é o "chamar
# função em argumento default" genérico que a regra existe pra pegar.
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
